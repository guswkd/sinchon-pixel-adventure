<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>필드 캐릭터 — 연세 과잠</title><style>
@font-face{font-family:Galmuri;src:url('../assets/fonts/Galmuri9.woff2')}*{box-sizing:border-box}body{margin:0;background:#eae6d9;color:#293746;font-family:Galmuri,monospace}main{max-width:650px;margin:55px auto;padding:24px}a{color:#335e94;font-size:11px}h1{font-size:23px;font-weight:400;margin:28px 0 12px}p{font-size:11px;line-height:1.9;color:#64717a}nav{display:flex;gap:8px;margin:24px 0}button{font:inherit;font-size:12px;padding:10px 20px;border:1px solid #526b86;background:#faf5e6;color:#34465c;cursor:pointer;user-select:none}button[aria-pressed=true]{background:#315c96;color:#fff4dc}.poses{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pose{padding:20px 0 12px;text-align:center;border:1px solid #c4c9c5;background:#f6f2e5}.pose canvas{width:96px;height:128px;image-rendering:pixelated;display:block;margin:auto}.pose span{display:block;font-size:10px;margin-top:16px;color:#66757c}.native{display:flex;align-items:center;gap:16px;padding:20px;margin-top:16px;border:1px solid #c4c9c5;font-size:10px}.native canvas{image-rendering:pixelated;width:24px;height:32px}.note{margin-top:24px;font-size:10px}@media(max-width:550px){main{margin:20px auto;padding:20px}.poses{grid-template-columns:repeat(2,1fr)}button{padding:10px 14px}}
</style></head><body><main><a href="../prototype/?rev=avatar2">← 게임으로</a><h1>새 필드 캐릭터</h1><p>큰 모자와 짧은 팔다리, 또렷한 눈.<br>심향의 필드 비율을 참고해 다시 그린 연세 과잠 캐릭터.</p><nav aria-label="동작 선택"><button data-gait="idle" aria-pressed="true">서 있기</button><button data-gait="walk" aria-pressed="false">걷기</button><button data-gait="run" aria-pressed="false">달리기</button></nav><div class="poses"><div class="pose"><canvas width="24" height="32" data-dir="0"></canvas><span>정면</span></div><div class="pose"><canvas width="24" height="32" data-dir="1"></canvas><span>왼쪽</span></div><div class="pose"><canvas width="24" height="32" data-dir="2"></canvas><span>오른쪽</span></div><div class="pose"><canvas width="24" height="32" data-dir="3"></canvas><span>뒷모습</span></div></div><div class="native"><canvas width="24" height="32" data-dir="0"></canvas><span>원본 크기 · 24 × 32 px</span></div><p class="note">비율·실루엣 참고: <a href="https://bulbapedia.bulbagarden.net/wiki/File:EthanHGSSwalkdown.png">하트골드·소울실버 심향 필드 도트</a><br>게임에는 새로 그린 도트를 사용합니다.</p></main><script type="module">
import {paintAvatar} from '../prototype/avatar.mjs?v=2';
let gait='idle';const canvases=[...document.querySelectorAll('canvas')];
for(const button of document.querySelectorAll('button'))button.onclick=()=>{gait=button.dataset.gait;for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button));};
function draw(time){const frame=Math.floor(time/1000*(gait==='run'?12:8))%4;for(const canvas of canvases){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,24,32);paintAvatar(ctx,Number(canvas.dataset.dir),gait,frame);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
