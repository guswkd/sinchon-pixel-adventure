<!doctype html><html lang="ko"><meta charset="utf-8"><title>신촌 산책 캐릭터</title><style>body{background:#efebd6;color:#334537;font:14px sans-serif;padding:20px}canvas{display:block;width:100%;max-width:960px;image-rendering:pixelated;background:#d2d9ad;border:2px solid #64755c}p{line-height:1.7}</style><h1>새 필드 캐릭터</h1><p>정면 · 왼쪽 · 오른쪽 · 후면, 각 방향의 정지 / 왼발 / 오른발 프레임</p><canvas id="preview" width="288" height="100"></canvas><script src="../sprites.js"></script><script>const c=document.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;for(let d=0;d<4;d++){for(let f=0;f<3;f++)paintSprite(c,8+d*70+f*20,10,'hero',d,f);}['guide','officer','student','musician','girl','clerk','baker'].forEach((s,i)=>paintSprite(c,16+i*38,60,s));</script></html>
